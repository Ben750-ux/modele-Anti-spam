<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Résultat</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #ffffff;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 700px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .spam {
            color: #d9534f;
            font-weight: bold;
            font-size: 18px;
        }
        .ham {
            color: #28a745;
            font-weight: bold;
            font-size: 18px;
        }
        .category {
            margin-top: 15px;
            font-size: 16px;
            color: #555;
        }
        .warning {
            background: #fff3cd;
            padding: 12px;
            border-radius: 8px;
            margin-top: 20px;
            color: #856404;
            font-size: 15px;
        }
        a {
            display: inline-block;
            margin-top: 25px;
            text-decoration: none;
            color: #007bff;
            font-size: 15px;
        }
        a:hover {
            text-decoration: underline;
        }
        /* Responsive mobile */
        @media (max-width: 600px) {
            .container {
                margin: 20px;
                padding: 20px;
            }
            .spam, .ham {
                font-size: 16px;
            }
            .category, .warning {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Résultat de l'analyse</h1>
        {% if prediction == "spam" %}
            <p class="spam">⚠️ Message détecté comme <strong>SPAM</strong></p>
            <p class="category">Catégorie : <strong>{{ category }}</strong></p>
            <p class="warning">⚠️ Attention : Ne cliquez sur aucun lien ni pièce jointe.</p>
        {% else %}
            <p class="ham">✅ Message normal.</p>
        {% endif %}
        <a href="/">↩ Retour</a>
    </div>
</body>
</html>
