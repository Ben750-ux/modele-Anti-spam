<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>IA Détecteur de Spam</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #f4f6f9, #e8ecf3);
            margin: 0;
            padding: 0;
            color: #2c3e50;
        }
        .container {
            max-width: 900px;
            margin: 3rem auto;
            background: #fff;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }
        h1 {
            text-align: center;
            margin-bottom: 1rem;
            font-size: 2.2rem;
            color: #0d48b1;
        }
        p {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 1.1rem;
            color: #555;
        }
        textarea {
            width: 95%; /* évite de coller aux bords */
            min-height: 180px;
            padding: 1rem;
            border: 1px solid #ccc;
            border-radius: 12px;
            font-size: 1rem;
            margin: 0 auto 1.5rem auto; /* centré */
            display: block;
            resize: vertical;
            outline: none;
            background: #f9f9f9;
            color: #2c3e50;
        }
        textarea::placeholder {
            color: #aaa;
        }
        button {
            display: block;
            width: 95%;
            margin: 0 auto;
            background: #0d48b1;
            color: #fff;
            border: none;
            padding: 1rem;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        button:hover {
            background: #09357d;
            transform: scale(1.05);
        }
        .footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.9rem;
            color: #777;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .container {
                margin: 1.5rem;
                padding: 1.5rem;
            }
            h1 {
                font-size: 1.8rem;
            }
            textarea, button {
                width: 100%; /* sur mobile, prend toute la largeur */
            }
        }
        @media (max-width: 480px) {
            h1 {
                font-size: 1.5rem;
            }
            p {
                font-size: 1rem;
            }
            textarea {
                min-height: 140px;
                font-size: 0.9rem;
            }
            button {
                font-size: 1rem;
                padding: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📩 IA Détecteur de Spam</h1>
        <p>Collez vos messages ci‑dessous (un par ligne) et laissez l’IA analyser automatiquement.</p>
        <form method="post">
            <textarea name="messages" placeholder="Exemple :&#10;Salut, peux‑tu me confirmer la réunion de demain à 10h ?&#10;Merci pour ton aide hier, c’était vraiment utile.&#10;Félicitations ! Vous avez gagné un iPhone 15. Cliquez ici pour réclamer votre prix."></textarea>
            <button type="submit">🔍 Analyser les messages</button>
        </form>
        <div class="footer">
            Propulsé par Flask + Scikit‑learn
        </div>
    </div>
</body>
</html>
