<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Détecteur de Spam</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #ffffff;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 700px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            min-height: 120px;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: none;
            font-size: 15px;
        }
        button {
            display: block;
            width: 100%;
            padding: 14px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        button:hover {
            background: #0056b3;
        }
        /* Responsive mobile */
        @media (max-width: 600px) {
            .container {
                margin: 20px;
                padding: 20px;
            }
            textarea {
                min-height: 100px;
            }
            button {
                font-size: 15px;
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📩 IA Détecteur de Spam</h1>
        <form method="POST" action="/analyze">
            <textarea name="message" placeholder="Collez un seul message ici..." required></textarea>
            <button type="submit">Analyser</button>
        </form>
    </div>
</body>
</html>
